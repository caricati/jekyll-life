<!DOCTYPE html>
<html lang="{{ site.language }}">
  <head>
    {% include meta.html %}
    <title>{{ page.title }} - {{ site.title }}</title>

    <link rel="stylesheet" href="{{'/assets/css/main.css' | absolute_url}}" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css"
      integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ=="
      crossorigin=""
    />
    <script
      type="text/javascript"
      src="{{'/assets/js/jquery.min.js' | absolute_url}}"
    ></script>
  </head>
  <body>
    <main>
      {% include header.html %}
      <section id="blog">
        <div class="page-content max-width">
          <article class="mb-32 text-content">
            <header>
              <h1 class="heading-underscore">{{ page.title }}</h1>
              <p class="metainfos">
                <time datetime="{{ page.date | date: "%Y-%m-%d" }}">{{ page.date | date: "%d/%m/%Y %H:%M" }}</time>
              </p>
            </header>

            {{ content }}
            <footer>
              <p>
                {% for tag in page.tags %}
                  <span class="tag">{{ tag }}</span>
                {% endfor %}
              </p>
            </footer>
          </article>
          <div class="mb-32">
            {% include comments.html %}
          </div>
        </div>
      </section>
      {% include footer.html %}
    </main>
    <div id="portal"></div>

    <script
      type="text/javascript"
      src="{{'/assets/js/scripts.js' | absolute_url}}"
    ></script>
    <script
      src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"
      integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ=="
      crossorigin=""
    ></script>
  </body>
</html>
